# Kamal 2 single-host deployment. Infrastructure-specific values are supplied
# by the deploy environment instead of being committed to the repository.
service: <%= ENV.fetch("KAMAL_SERVICE", "umanni-users") %>
image: <%= ENV.fetch("KAMAL_IMAGE", "brunoschumacherf/fullstack-developer") %>

servers:
  web:
    - <%= ENV.fetch("DEPLOY_HOST") %>

proxy:
  ssl: true
  host: <%= ENV.fetch("APP_HOST") %>
  forward_headers: true
  healthcheck:
    path: /up
    interval: 3
    timeout: 3

deploy_timeout: 60
drain_timeout: 30

registry:
  server: ghcr.io
  username: <%= ENV.fetch("KAMAL_REGISTRY_USERNAME", "brunoschumacherf") %>
  password:
    - KAMAL_REGISTRY_PASSWORD

ssh:
  user: <%= ENV.fetch("DEPLOY_USER", "root") %>

env:
  secret:
    - RAILS_MASTER_KEY
    - DATABASE_URL
  clear:
    SOLID_QUEUE_IN_PUMA: true
    INERTIA_SSR: true
    RUBY_ZJIT_ENABLE: 1
    CACHE_SIZE: 67108864
    MAX_CACHE_ITEM_SIZE: 1048576
    GZIP_COMPRESSION_ENABLED: true
    GZIP_COMPRESSION_DISABLE_ON_AUTH: true

aliases:
  console: app exec --interactive --reuse "bin/rails console"
  shell: app exec --interactive --reuse "bash"
  logs: app logs -f
  dbc: app exec --interactive --reuse "bin/rails dbconsole --include-password"

volumes:
  - "umanni_users_storage:/rails/storage"

asset_path: /rails/public

builder:
  arch: amd64

accessories:
  db:
    image: postgres:16
    host: <%= ENV.fetch("DEPLOY_HOST") %>
    env:
      clear:
        POSTGRES_USER: umanni
        POSTGRES_DB: user_management_production
      secret:
        - POSTGRES_PASSWORD
    directories:
      - data:/var/lib/postgresql/data
