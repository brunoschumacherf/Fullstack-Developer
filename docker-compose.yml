services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: user_management_development
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      dockerfile: Dockerfile.dev
    entrypoint: ["bash", "bin/docker-dev-entrypoint"]
    command: ["bin/dev"]
    volumes:
      - .:/rails
      - bundle_data:/usr/local/bundle
      - node_modules_data:/rails/node_modules
    ports:
      - "3000:3000"
      - "3036:3036"
    environment:
      DATABASE_URL: postgres://postgres:password@db:5432/user_management_development
      RAILS_ENV: development
      VITE_RUBY_HOST: 0.0.0.0
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
  bundle_data:
  node_modules_data: